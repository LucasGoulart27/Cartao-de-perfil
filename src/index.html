<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="./output.css">
    <title>Document</title>
</head>
<body class="w-full h-screen flex items-center justify-center bg-linear-to-t from-blue-500 to-purple-500">
    <div id="Cartao" class="w-2xl p-4 rounded-2xl bg-white/20 border-2 border-white/25 shadow-lg flex items-center justify-center flex-col gap-5 transition-transform duration-150 will-change-transform">
        <img src="/Img/foto_perfil.png" alt="Foto" class="w-40 h-40 rounded-full border-4 border-white/50 object-cover">
        <h1 class="text-3xl text-white font-bold">Daniel Nascimento</h1>
        <div class="w-full flex items-center justify-center gap-5">
            <span class="p-1 rounded-full bg-white/30 flex items-center justify-center gap-1">
                <div class="w-9 h-9 rounded-full flex items-center justify-center bg-white">
                    <i class='bx bxs-location-plus text-2xl'></i>
                </div>
                Santos, São Paulo
            </span>
            <span class="p-1 rounded-full bg-white/30 flex items-center justify-center gap-1">
                <div class="w-9 h-9 rounded-full flex items-center justify-center bg-white">
                    <i class='bx bxs-palette text-2xl'></i>
                </div>
                Design Gráfico
            </span>
            <span class="p-1 rounded-full bg-white/30 flex items-center justify-center gap-1">
                <div class="w-9 h-9 rounded-full flex items-center justify-center bg-white">
                    <i class='bx bxs-cake text-2xl'></i>
                </div>
                15 de Janeiro
            </span>
        </div>
        <div class="w-full flex items-center justify-center gap-3">
            <button class="w-32 h-12 rounded-full cursor-pointer bg-linear-to-r from-red-700 to-red-500 text-white flex items-center justify-center gap-2">
                <i class='bx bxl-youtube text-2xl'></i>
                Youtube
            </button>
            <button class="w-32 h-12 rounded-full cursor-pointer bg-linear-to-r from-blue-700 to-blue-500 text-white flex items-center justify-center gap-2">
                <i class='bx bxl-facebook-circle text-2xl' ></i>
                Facebook
            </button>
            <button class="w-32 h-12 rounded-full cursor-pointer bg-linear-to-r from-amber-300 via-red-500 to-purple-500 text-white flex items-center justify-center gap-2">
                <i class='bx bxl-instagram-alt text-2xl' ></i>
                Instagram
            </button>
            <button class="w-32 h-12 rounded-full cursor-pointer bg-linear-to-r from-blue-500 to-blue-400 text-white flex items-center justify-center gap-2">
                <i class='bx bxl-linkedin text-2xl'></i>
                Linkedin
            </button>
        </div>
        <div class="w-full flex items-center justify-center gap-2">
            <button class="w-full h-11 cursor-pointer bg-white rounded-xl">Mensagem</button>
        </div>
    </div>
    <script src="./script.js"></script>
</body>
</html>
